name: Build, verify and deploy RoslynWeb
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: roslynweb-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.100'
      - name: Cache pinned NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-roslynweb-nuget-${{ hashFiles('global.json', 'managed/**/*.csproj') }}
          restore-keys: ${{ runner.os }}-roslynweb-nuget-
      - name: Restore public test fixtures
        run: node scripts/prepare-fixtures.mjs
      - name: Build compiler WebAssembly
        run: npm run build
      - name: Native managed assertions and real IL fixture generation
        run: dotnet run --project managed/SelfTest/SelfTest.csproj -c Release
      - name: Native CLR and MSBuild differential baselines
        run: |
          DOTNET=dotnet node tests/il-types-verify-native.mjs
          DOTNET=dotnet node tests/il-collections-verify-native.mjs
          DOTNET=dotnet node tests/projects-v4-verify-native.mjs
          DOTNET=dotnet node tests/wasm-native-verify-native.mjs
          DOTNET=dotnet node tests/compiler-v6-verify-native.mjs
          DOTNET=dotnet node tests/compiler-v7-verify-native.mjs
          DOTNET=dotnet node tests/standard-values-verify-native.mjs
          DOTNET=dotnet node tests/float-literals-verify-native.mjs
          DOTNET=dotnet node tests/value-interfaces-verify-native.mjs
          DOTNET=dotnet node tests/events-verify-native.mjs
      - name: Reproduce unchanged desktop DLL fixtures against Microsoft references
        run: bash scripts/prepare-desktop-fixtures.sh --check
      - name: JavaScript and project tests
        run: npm test
      - name: CAD framework and event compiler differential tests
        run: |
          npm run test:events
          npm run test:cad-bcl
          npm run test:cad-format
          npm run test:compiler-services
      - name: Actual WebAssembly integration
        run: npm run test:wasm
      - name: Worker integration
        run: npm run test:worker
      - name: Production Node host and command-line integration with installed package
        run: |
          npm run test:node
          npm run test:cli
      - name: Managed compiler extension integration
        run: node managed/runtime-tooling-tests.mjs
      - name: Extended compatibility integration
        run: npm run test:compat
      - name: Managed tasks and resources in WebAssembly
        run: node managed/runtime-build-tests.mjs
      - name: Public resource, task and Reflection.Emit APIs
        run: npm run test:build
      - name: Actual Worker project builds
        run: npm run test:projects-wasm
      - name: Managed filesystem and persistent workspace ABI
        run: node managed/runtime-files-tests.mjs
      - name: Public managed files and native WASI Worker APIs
        run: node scripts/test-v4.mjs
      - name: Original desktop binaries in actual WebAssembly
        run: node tests/desktop/wasm.mjs
      - name: Direct C# to native WebAssembly integration
        run: npm run test:wasm-native
      - name: Optimized JavaScript and native Wasm public compiler APIs
        run: npm run test:compilers
      - name: Typed numeric kernels, native intrinsics and tuple interfaces through Worker
        run: npm run test:compilers-v7
      - name: Full netDxf library in managed Wasm and generated compiler backends
        run: |
          npm run test:netdxf
          npm run test:netdxf-compilers
          npm run test:netdxf-entities
          node tests/argument-exceptions-integration.mjs
      - name: TypeScript public API contract
        run: npx --yes --package typescript@5.9.3 tsc --strict --noEmit --module NodeNext --moduleResolution NodeNext --target ES2022 tests/compiler-types.test.ts
      - name: Roslyn cache semantics and actual WebAssembly compilation latency
        run: npm run test:performance
      - name: Direct WebAssembly pipeline and execution benchmarks
        run: npm run benchmark:wasm
      - name: Compare compiler modes and compilation caches
        run: npm run benchmark:compilers
      - name: Compare typed numeric kernels and native intrinsic performance
        run: npm run benchmark:compilers-v7
      - name: Compare warm emission against the previous host implementation
        run: npm run benchmark:host-cache -- --output docs/host-performance-v7.json
      - name: Upload compiler verification and performance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-verification
          path: |
            docs/*verification.json
            docs/*performance.json
            docs/compiler-performance-v6.json
            docs/compiler-performance-v7.json
            docs/host-performance-v7.json
          if-no-files-found: ignore
      - name: Stage browser application
        run: node scripts/stage-pages.mjs
      - name: Install Chromium browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Real Chromium demo and browser integration at the Pages subpath
        run: npm run test:browser
        env:
          BROWSER_ENGINE: chromium
      - name: Real WebGPU netDxf browser integration
        run: npm run test:netdxf-browser
      - name: Upload browser verification and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: |
            artifacts/browser-*
            artifacts/dxf-browser
          if-no-files-found: ignore
      - name: Upload complete runnable project artifact
        uses: actions/upload-artifact@v4
        with:
          name: roslynweb-source-and-wasm
          path: |
            src
            bin
            examples
            vendor
            managed
            dist
            demo
            scripts
            tests
            docs
            licenses
            package.json
            global.json
            README.md
            LICENSE
            THIRD-PARTY-NOTICES.md
            !managed/**/bin/**
            !managed/**/obj/**
            !managed/publish/**
            !managed/RoslynPatched/**
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/pages
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install deployed-site browser verification runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Verify the deployed Pages application in Chromium
        run: npm run test:browser
        env:
          BROWSER_ENGINE: chromium
          BROWSER_BASE_URL: ${{ steps.deployment.outputs.page_url }}
          BROWSER_FULL_DEMO: '1'
      - name: Verify the deployed netDxf WebGPU sample
        run: npm run test:netdxf-browser
        env:
          DXF_BROWSER_BASE_URL: ${{ steps.deployment.outputs.page_url }}
      - name: Upload deployed-site browser verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-browser-verification
          path: |
            artifacts/browser-*
            artifacts/dxf-browser
          if-no-files-found: ignore
